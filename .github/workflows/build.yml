name: Build NovaModMenu dylib (iOS arm64)
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          mkdir -p "$HOME/theos/sdks"
          # Clone the SDK repository instead of unzipping its archive: the archive
          # contains symlinks that macOS hosted runners may reject during extraction.
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          SDK_DIR="$(find /tmp/theos-sdks -type d -name 'iPhoneOS*.sdk' -print -quit)"
          test -n "$SDK_DIR"
          ln -s "$SDK_DIR" "$HOME/theos/sdks/$(basename "$SDK_DIR")"
      - name: Build tweak
        shell: bash
        run: |
          set -euo pipefail
          make clean || true
          make FINALPACKAGE=1
          mkdir -p output
          DYLIB="$(find .theos -type f -name 'NovaModMenu.dylib' -print -quit)"
          test -n "$DYLIB"
          cp "$DYLIB" output/NovaModMenu.dylib
          file output/NovaModMenu.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: NovaModMenu-dylib-arm64
          path: output/NovaModMenu.dylib
          if-no-files-found: error
